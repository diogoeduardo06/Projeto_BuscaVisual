<!DOCTYPE html>
<html lang="pt-br">

<head>
<meta charset="UTF-8">
<title>Formulário</title>

<style>
body {
  background: #0f172a;
  color: white;
  font-family: Arial;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

form {
  background: #1e293b;
  padding: 30px;
  border-radius: 12px;
  width: 320px;
}

h2 {
  text-align:center;
}

.group {
  margin-bottom:15px;
}

label {
  display:block;
  margin-bottom:5px;
  font-size:14px;
  opacity:0.9;
}

input, select {
  width:100%;
  padding:10px;
  border-radius:8px;
  border:none;
}

button {
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  background:#22c55e;
  color:white;
  font-size:16px;
  cursor:pointer;
  margin-top:10px;
}
</style>
</head>

<body>

<form id="form">
  <h2>Dados</h2>

  <div class="group">
    <label>Idade</label>
    <input name="idade" required>
  </div>

  <div class="group">
    <label>Sexo</label>
    <select name="sexo">
      <option value="M">Masculino</option>
      <option value="F">Feminino</option>
      <option value="Outro">Outro</option>
    </select>
  </div>

  <div class="group">
    <label>Horas de sono</label>
    <input name="sono">
  </div>

  <div class="group">
    <label>Consumiu cafeína?</label>
    <select name="cafeina">
      <option value="Sim">Sim</option>
      <option value="Não">Não</option>
    </select>
  </div>

  <div class="group">
    <label>Joga videogame?</label>
    <select name="jogos">
      <option value="Sim">Sim</option>
      <option value="Não">Não</option>
    </select>
  </div>

  <div class="group">
    <label>Usa óculos?</label>
    <select name="oculos">
      <option value="Sim">Sim</option>
      <option value="Não">Não</option>
    </select>
  </div>

  <button type="submit">Começar</button>
</form>

<script>
document.getElementById("form").addEventListener("submit", function (e) {
  e.preventDefault();

  const data = new FormData(this);
  const params = new URLSearchParams(data);

  params.append("id", "P" + Math.floor(Math.random() * 100000));

  window.location.href = "/teste.html?" + params.toString();
});
</script>

</body>
</html>
