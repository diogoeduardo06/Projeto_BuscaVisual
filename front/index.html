<!DOCTYPE html>
<html lang="pt-br">
<head>

  <title>Experimento</title>

  <style>

      background:#0f172a;

      display:flex;
      justify-content:center;

      height:100vh;
      text-align:center;
    }

    .box {

      border-radius:10px;

      color:white;
      cursor:pointer;
    }

    button:hover {
      transform:scale(1.05);
    }

</head>

<body>

<div class="box">
  <h1>Experimento de Busca Visual</h1>
  <p>Você será direcionado para um formulário antes do teste.</p>

<script>
function start(){
  window.location.href = "form.html";
}
</script>

</body>
</html>
